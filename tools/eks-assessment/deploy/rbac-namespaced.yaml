apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-assessment
  namespace: assessment-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eks-assessment-readonly
  namespace: REPLACE_NAMESPACE
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services", "persistentvolumeclaims", "serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eks-assessment-readonly
  namespace: REPLACE_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: eks-assessment
    namespace: assessment-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eks-assessment-readonly
