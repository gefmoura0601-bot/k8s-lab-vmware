name: Nginx Image CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/nginx-lab/**'
      - '.github/workflows/nginx-image-ci.yaml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize owner
        id: owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app/nginx-lab
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/nginx-lab:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/nginx-lab:latest

      - name: Update GitOps manifest with new tag
        run: |
          sed -i 's|image: ghcr.io/.*/nginx-lab:.*|image: ghcr.io/${{ steps.owner.outputs.owner_lc }}/nginx-lab:${{ steps.vars.outputs.tag }}|' kubernetes/apps/nginx-lab/all.yaml
          grep 'image:' kubernetes/apps/nginx-lab/all.yaml

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/apps/nginx-lab/all.yaml

          if git diff --cached --quiet; then
            echo "Sem mudanças para commit."
            exit 0
          fi

          git commit -m "ci: update nginx-lab image tag to ${{ steps.vars.outputs.tag }}"
          git push
