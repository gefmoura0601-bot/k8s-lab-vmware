name: Banking Images CI

on:
  push:
    branches: [main]
    paths:
      - app/account-service-java/**
      - app/transaction-service-dotnet/**
      - .github/workflows/banking-images-ci.yaml
  workflow_dispatch:

concurrency:
  group: banking-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Normalize image metadata
        id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Account Service
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app/account-service-java
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/account-service-java:${{ steps.meta.outputs.tag }}

      - name: Build and publish Transaction Service
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app/transaction-service-dotnet
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/transaction-service-dotnet:${{ steps.meta.outputs.tag }}

      - name: Update GitOps image references
        shell: bash
        run: |
          sed -i \
            "s|image: ghcr.io/.*/account-service-java:.*|image: ghcr.io/${{ steps.meta.outputs.owner }}/account-service-java:${{ steps.meta.outputs.tag }}|" \
            kubernetes/apps/banking/account-service.yaml
          sed -i \
            "s|image: ghcr.io/.*/transaction-service-dotnet:.*|image: ghcr.io/${{ steps.meta.outputs.owner }}/transaction-service-dotnet:${{ steps.meta.outputs.tag }}|" \
            kubernetes/apps/banking/transaction-service.yaml

      - name: Create GitOps update PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "ci: deploy banking images ${{ steps.meta.outputs.tag }}"
          branch: automation/banking-${{ steps.meta.outputs.tag }}
          delete-branch: true
          title: "ci: deploy banking images ${{ steps.meta.outputs.tag }}"
          body: "Automated immutable image update generated by Banking Images CI."
          add-paths: |
            kubernetes/apps/banking/account-service.yaml
            kubernetes/apps/banking/transaction-service.yaml
