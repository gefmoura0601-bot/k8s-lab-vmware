name: postgres-api-image-ci

on:
  push:
    branches:
      - main
    paths:
      - 'app/postgres-api-go/**'
      - '.github/workflows/postgres-api-image-ci.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/gefmoura0601-bot/postgres-api-go

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: gefmoura0601-bot
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app/postgres-api-go
          file: ./app/postgres-api-go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update deployment image tag
        run: |
          sed -i 's|image: ghcr.io/gefmoura0601-bot/postgres-api-go:.*|image: ghcr.io/gefmoura0601-bot/postgres-api-go:sha-${{ needs.build-and-push.outputs.short_sha }}|' kubernetes/apps/postgres-api/deployment.yaml

      - name: Show diff
        run: git diff -- kubernetes/apps/postgres-api/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "gefmoura0601-bot"
          git config user.email "gefmoura0601@gmail.com"

          git add kubernetes/apps/postgres-api/deployment.yaml

          git diff --cached --quiet && exit 0

          git commit -m "chore: update postgres-api image to sha-${{ needs.build-and-push.outputs.short_sha }}"
          git push
