name: postgres-api-go-ci

on:
  push:
    branches:
      - main
    paths:
      - 'app/postgres-api-go/**'
      - '.github/workflows/postgres-api-go-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Run tests
        working-directory: app/postgres-api-go
        run: |
          go test ./...

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_TAG="${SHORT_SHA}"
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/k8s-lab-vmware-postgres-api-go"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./app/postgres-api-go
          push: true
          tags: ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}

      - name: Update kustomization image tag
        run: |
          IMAGE_NAME="${{ steps.meta.outputs.image_name }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|g" kubernetes/apps/postgres-api/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|g" kubernetes/apps/postgres-api/kustomization.yaml

      - name: Commit GitOps update
        if: ${{ false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/postgres-api/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: update postgres-api image to ${{ steps.meta.outputs.image_tag }} [skip ci]"
          git push

      - name: Create GitOps update PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "ci: update postgres-api image to ${{ steps.meta.outputs.image_tag }}"
          branch: "automation/postgres-api-${{ steps.meta.outputs.image_tag }}"
          delete-branch: true
          title: "ci: update postgres-api image to ${{ steps.meta.outputs.image_tag }}"
          body: "Automated GitOps image update generated by postgres-api-go-ci."
          add-paths: kubernetes/apps/postgres-api/kustomization.yaml
