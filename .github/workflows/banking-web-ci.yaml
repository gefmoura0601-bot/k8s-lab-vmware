name: Banking Web CI

on:
  pull_request:
    paths: ["app/banking-web/**", "kubernetes/apps/banking/**", ".github/workflows/banking-web-ci.yaml"]
  push:
    branches: [main]
    paths: ["app/banking-web/**", ".github/workflows/banking-web-ci.yaml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "24"}
      - working-directory: app/banking-web
        run: npm ci --ignore-scripts
      - working-directory: app/banking-web
        run: npm audit --audit-level=high
      - working-directory: app/banking-web
        run: npm run test
      - working-directory: app/banking-web
        run: npm run build

  publish:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app/banking-web
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/banking-web:${{ steps.meta.outputs.tag }}
      - shell: bash
        run: |
          sed -i "s|newTag: .*|newTag: ${{ steps.meta.outputs.tag }}|" kubernetes/apps/banking/kustomization.yaml
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961b8808d113e2c98fb63676 # v7
        with:
          commit-message: "ci: deploy banking web ${{ steps.meta.outputs.tag }}"
          branch: automation/banking-web-${{ steps.meta.outputs.tag }}
          delete-branch: true
          title: "ci: deploy banking web ${{ steps.meta.outputs.tag }}"
          body: Automated immutable image update generated by Banking Web CI.
          add-paths: kubernetes/apps/banking/kustomization.yaml
