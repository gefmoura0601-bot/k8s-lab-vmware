name: Banking Web CI

on:
  pull_request:
    paths: ["app/banking-web/**", "kubernetes/apps/banking/**", ".github/workflows/banking-web-ci.yaml"]
  push:
    branches: [main]
    paths:
      - app/banking-web/**
      - "!app/banking-web/**/*.test.ts"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "24"}
      - working-directory: app/banking-web
        run: npm ci --ignore-scripts
      - working-directory: app/banking-web
        run: npm audit --audit-level=high
      - working-directory: app/banking-web
        run: npm run test
      - working-directory: app/banking-web
        run: npm run build
      - name: Validate reverse-proxy redirect
        shell: bash
        run: |
          docker build -t banking-web:redirect-test app/banking-web
          container="$(docker run -d -p 127.0.0.1::8080 banking-web:redirect-test)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$container" 8080/tcp | sed 's/.*://')"
          for attempt in {1..20}; do
            location="$(curl -sS -D - -o /dev/null "http://127.0.0.1:${port}/" | awk 'BEGIN{IGNORECASE=1} /^Location:/{gsub("\\r", ""); print $2}')" && break
            sleep 0.25
          done
          test "$location" = "/banking/"

  publish:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app/banking-web
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/banking-web:${{ steps.meta.outputs.tag }}
      - name: Update GitOps image reference
        id: update
        shell: bash
        run: |
          sed -i "s|newTag: .*|newTag: ${{ steps.meta.outputs.tag }}|" kubernetes/apps/banking/kustomization.yaml
          git diff --check
          if git diff --quiet -- kubernetes/apps/banking/kustomization.yaml; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package portable GitOps update
        if: steps.update.outputs.has_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/banking-web-gitops-${{ steps.meta.outputs.tag }}"
          mkdir -p "$output"
          git diff --check
          git diff --binary -- kubernetes/apps/banking/kustomization.yaml \
            > "$output/banking-web-${{ steps.meta.outputs.tag }}.patch"
          cp kubernetes/apps/banking/kustomization.yaml "$output/"
          printf 'tag=%s\n' '${{ steps.meta.outputs.tag }}' > "$output/metadata.txt"

      - name: Upload portable GitOps update
        if: steps.update.outputs.has_update == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: banking-web-gitops-${{ steps.meta.outputs.tag }}
          path: ${{ runner.temp }}/banking-web-gitops-${{ steps.meta.outputs.tag }}
          if-no-files-found: error
          retention-days: 14

      - name: Detect GitOps automation credential
        id: gitops_auth
        if: steps.update.outputs.has_update == 'true'
        shell: bash
        env:
          BANKING_GITOPS_TOKEN: ${{ secrets.BANKING_GITOPS_TOKEN }}
        run: |
          if [[ -n "$BANKING_GITOPS_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitOps update PR
        id: gitops_pr
        if: steps.update.outputs.has_update == 'true' && steps.gitops_auth.outputs.configured == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.BANKING_GITOPS_TOKEN }}
          commit-message: "ci: deploy banking web ${{ steps.meta.outputs.tag }}"
          branch: automation/banking-web-${{ steps.meta.outputs.tag }}
          delete-branch: true
          title: "ci: deploy banking web ${{ steps.meta.outputs.tag }}"
          body: Automated immutable image update generated by Banking Web CI.
          add-paths: kubernetes/apps/banking/kustomization.yaml

      - name: Publish GitOps handoff summary
        if: always()
        shell: bash
        env:
          HAS_UPDATE: ${{ steps.update.outputs.has_update }}
          PR_OUTCOME: ${{ steps.gitops_pr.outcome }}
          PR_URL: ${{ steps.gitops_pr.outputs.pull-request-url }}
        run: |
          if [[ "$HAS_UPDATE" != "true" ]]; then
            echo "### GitOps já atualizado" >> "$GITHUB_STEP_SUMMARY"
            echo "O manifest já referencia o tag ${{ steps.meta.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PR_OUTCOME" == "success" && -n "$PR_URL" ]]; then
            echo "### PR GitOps criada" >> "$GITHUB_STEP_SUMMARY"
            echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Handoff GitOps portátil" >> "$GITHUB_STEP_SUMMARY"
            echo "Baixe o artifact banking-web-gitops-${{ steps.meta.outputs.tag }} e aplique o patch em uma branch autorizada." >> "$GITHUB_STEP_SUMMARY"
            echo "Para automação integral, configure BANKING_GITOPS_TOKEN com Contents/PR write e bypass explícito apenas para esta ruleset." >> "$GITHUB_STEP_SUMMARY"
