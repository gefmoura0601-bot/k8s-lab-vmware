name: Validate Memory Unschedulable
run-name: Memory scheduling capacity test by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite TEST-INSUFFICIENT-MEMORY para confirmar o experimento
        required: true
        type: string

concurrency:
  group: validate-memory-lab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-memory-unschedulable:
    name: Validate Pending and FailedScheduling
    runs-on: [self-hosted, master]
    environment: lab
    timeout-minutes: 8
    steps:
      - name: Confirm experiment
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "${CONFIRMATION}" = "TEST-INSUFFICIENT-MEMORY"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate insufficient memory scheduling
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validation/validate-memory-unschedulable.sh 2>&1 | tee memory-unschedulable.txt

      - name: Capture final state
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo
            echo "=== Final state ==="
            kubectl get nodes
            kubectl get namespace memory-scheduling-lab 2>/dev/null || true
            kubectl -n memory-scheduling-lab get pod,events 2>/dev/null || true
            kubectl top nodes
          } >> memory-unschedulable.txt 2>&1

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-unschedulable-${{ github.run_id }}
          path: memory-unschedulable.txt
          if-no-files-found: error
          retention-days: 14