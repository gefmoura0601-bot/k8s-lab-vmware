name: Validate IaC

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-iac:
    name: Validate IaC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Vagrantfile syntax
        run: ruby -c iac/vagrant/Vagrantfile

      - name: Validate shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck "${scripts[@]}"

      - name: Reject mutable references, artifacts, and merge markers
        shell: bash
        run: |
          matches="$(
            git grep -nE '<<<<<<<|>>>>>>>|image: .+:latest|targetRevision: HEAD' \
              -- '*.yaml' '*.yml' '.gitignore' |
              grep -vE 'kubernetes/policies/kyverno/disallow-latest.yaml|.github/workflows/validate.yml' || true
          )"
          if [[ -n "${matches}" ]]; then
            echo "${matches}"
            echo "Mutable references or unresolved merge markers found." >&2
            exit 1
          fi

          artifacts="$(
            git ls-files |
              grep -E '(^|/)(coverage\.out|[^/]+\.test|[^/]+\.bak)$|^app/[^/]+-go/[^/.]+-go$' ||
              true
          )"
          if [[ -n "${artifacts}" ]]; then
            echo "${artifacts}"
            echo "Generated or backup artifacts must not be committed." >&2
            exit 1
          fi

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_stream(File.read(file)) }' \
            $(git ls-files '*.yaml' '*.yml')

      - name: Validate Grafana dashboards
        shell: bash
        run: |
          mapfile -t dashboards < <(find kubernetes -type f -name '*dashboard*.json' -print)
          for dashboard in "${dashboards[@]}"; do
            jq -e '.title and (.panels | type == "array") and (.panels | length > 0)' "$dashboard" >/dev/null
            duplicate_ids="$(jq -r '[.panels[].id] | group_by(.)[] | select(length > 1) | .[0]' "$dashboard")"
            if [[ -n "${duplicate_ids}" ]]; then
              echo "Duplicate panel IDs in ${dashboard}: ${duplicate_ids}" >&2
              exit 1
            fi
          done
      - name: Validate local Markdown links
        shell: ruby {0}
        run: |
          require "uri"

          broken = []
          Dir.glob("**/*.md").each do |file|
            File.read(file).scan(/(?<!!)\[[^\]]+\]\(([^)]+)\)/).flatten.each do |link|
              target = link.split("#", 2).first
              next if target.empty? || target.match?(%r{\A(?:https?://|mailto:)})

              path = File.expand_path(URI::DEFAULT_PARSER.unescape(target), File.dirname(file))
              broken << "#{file}: #{link}" unless File.exist?(path)
            end
          end

          abort broken.join("\n") unless broken.empty?

      - name: Render Kustomize trees
        run: |
          for file in $(git ls-files 'kubernetes/**/kustomization.yaml'); do
            kubectl kustomize "$(dirname "$file")" >/dev/null
          done

  validate-go:
    name: Validate Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - app/cpu-producer-go
          - app/cpu-worker-go
          - app/postgres-api-go
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out ./...

  validate-java:
    name: Validate Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: maven:3.9.11-eclipse-temurin-25-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test and package
        working-directory: app/account-service-java
        run: mvn --batch-mode verify

  validate-dotnet:
    name: Validate .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore
        working-directory: app/transaction-service-dotnet
        run: dotnet restore

      - name: Build
        working-directory: app/transaction-service-dotnet
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: app/transaction-service-dotnet
        run: dotnet test tests/TransactionService.Tests --configuration Release
