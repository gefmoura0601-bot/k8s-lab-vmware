name: Validate IaC

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-iac:
    name: Validate IaC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Vagrantfile syntax
        run: ruby -c iac/vagrant/Vagrantfile

      - name: Validate shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck "${scripts[@]}"

      - name: Reject mutable references, artifacts, and merge markers
        shell: bash
        run: |
          matches="$(
            git grep -nE '<<<<<<<|>>>>>>>|image: .+:latest|targetRevision: HEAD' \
              -- '*.yaml' '*.yml' '.gitignore' |
              grep -vE 'kubernetes/policies/kyverno/disallow-latest.yaml|.github/workflows/validate.yml' || true
          )"
          if [[ -n "${matches}" ]]; then
            echo "${matches}"
            echo "Mutable references or unresolved merge markers found." >&2
            exit 1
          fi

          artifacts="$(
            git ls-files |
              grep -E '(^|/)(coverage\.out|[^/]+\.test|[^/]+\.bak)$|^app/[^/]+-go/[^/.]+-go$' ||
              true
          )"
          if [[ -n "${artifacts}" ]]; then
            echo "${artifacts}"
            echo "Generated or backup artifacts must not be committed." >&2
            exit 1
          fi

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_stream(File.read(file)) }' \
            $(git ls-files '*.yaml' '*.yml')

      - name: Render Kustomize trees
        run: |
          for file in $(git ls-files 'kubernetes/**/kustomization.yaml'); do
            kubectl kustomize "$(dirname "$file")" >/dev/null
          done

  validate-go:
    name: Validate Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - app/cpu-producer-go
          - app/cpu-worker-go
          - app/postgres-api-go
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out ./...
