name: Reconcile Argo CD

on:
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: [self-hosted, master]
    environment: lab
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check cluster
        run: kubectl get nodes

      - name: Reconcile Argo CD root
        run: |
          kubectl apply --server-side -f kubernetes/argocd/root-app.yaml
          kubectl -n argocd wait application/platform-root --for=jsonpath='{.status.health.status}'=Healthy --timeout=10m
