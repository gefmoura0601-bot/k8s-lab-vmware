apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memory-lab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git@github.com:gefmoura0601-bot/k8s-lab-vmware.git
    targetRevision: main
    path: kubernetes/apps/workers/memory-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: memory-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: memory-worker
      namespace: memory-lab
      jsonPointers:
        - /spec/replicas
