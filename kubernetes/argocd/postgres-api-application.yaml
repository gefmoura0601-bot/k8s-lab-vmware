apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  ignoreDifferences:
    - group: networking.istio.io
      kind: VirtualService
      name: postgres-api
      namespace: apps
      jqPathExpressions:
        - .spec.http[].route[].weight
    - group: ""
      kind: Service
      namespace: apps
      jqPathExpressions:
        - .spec.selector."rollouts-pod-template-hash"
  source:
    repoURL: git@github.com:gefmoura0601-bot/k8s-lab-vmware.git
    targetRevision: main
    path: kubernetes/apps/postgres-api
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
