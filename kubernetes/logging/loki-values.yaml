loki:
  enabled: true
  persistence:
    enabled: true
    storageClassName: local-path
    size: 20Gi
  config:
    auth_enabled: false
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push

grafana:
  enabled: false

prometheus:
  enabled: false

filebeat:
  enabled: false

fluent-bit:
  enabled: false

logstash:
  enabled: false
