apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-derived-metrics-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1", app: tempo}
data:
  tempo-derived-metrics.json: |
    {"uid":"tempo-derived-metrics","title":"Tempo / Métricas derivadas","tags":["tempo","tracing","red","argo-rollouts"],"schemaVersion":39,"version":1,"refresh":"10s","panels":[{"id":1,"type":"stat","title":"Requisições/s","datasource":"Prometheus","gridPos":{"h":4,"w":8,"x":0,"y":0},"targets":[{"refId":"A","expr":"sum(rate(traces_spanmetrics_calls_total{service=\"postgres-api\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) or vector(0)"}]},{"id":2,"type":"stat","title":"Taxa de sucesso","datasource":"Prometheus","gridPos":{"h":4,"w":8,"x":8,"y":0},"targets":[{"refId":"A","expr":"(1-sum(rate(traces_spanmetrics_calls_total{service=\"postgres-api\",status_code=\"STATUS_CODE_ERROR\"}[5m]))/clamp_min(sum(rate(traces_spanmetrics_calls_total{service=\"postgres-api\"}[5m])),0.001)) or vector(1)"}]},{"id":3,"type":"stat","title":"Latência p95","datasource":"Prometheus","gridPos":{"h":4,"w":8,"x":16,"y":0},"targets":[{"refId":"A","expr":"histogram_quantile(0.95,sum by(le)(rate(traces_spanmetrics_latency_bucket{service=\"postgres-api\",span_kind=\"SPAN_KIND_SERVER\"}[5m]))) or vector(0)"}]},{"id":4,"type":"timeseries","title":"Volume por status","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"refId":"A","expr":"sum by(status_code)(rate(traces_spanmetrics_calls_total{service=\"postgres-api\"}[5m]))","legendFormat":"{{status_code}}"}]},{"id":5,"type":"timeseries","title":"Percentis de latência","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":12,"y":4},"targets":[{"refId":"A","expr":"histogram_quantile(0.95,sum by(le)(rate(traces_spanmetrics_latency_bucket{service=\"postgres-api\"}[5m])))","legendFormat":"p95"}]},{"id":6,"type":"timeseries","title":"Análises do Argo Rollouts","datasource":"Prometheus","gridPos":{"h":8,"w":24,"x":0,"y":12},"targets":[{"refId":"A","expr":"argo_rollouts_analysis_run_metric_phase{namespace=\"apps\"}","legendFormat":"{{name}} / {{metric}} / {{phase}}"}]}]}
