apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-producer
  namespace: workers
  labels:
    app: cpu-producer
    team: platform
    environment: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-producer
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-03-20T18:58:30-03:00"
      labels:
        app: cpu-producer
        team: platform
        environment: lab
    spec:
      priorityClassName: batch-low
      containers:
        - name: cpu-producer
          image: ghcr.io/gefmoura0601-bot/cpu-producer-go:f483d87
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: workers-rabbitmq
                  key: RABBITMQ_URL
            - name: QUEUE_NAME
              value: cpu-jobs
            - name: MESSAGE_COUNT
              value: "80"
            - name: MESSAGE_PREFIX
              value: cpu-job
            - name: MESSAGE_DELAY_MS
              value: "10"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
