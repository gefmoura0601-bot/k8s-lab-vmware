apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-lab-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: memory-worker
data:
  memory-lab-dashboard.json: |
    {"uid":"memory-lab-keda","title":"Memory Lab / KEDA and OOM","tags":["keda","memory","oom","rabbitmq","lab"],"timezone":"browser","schemaVersion":39,"version":1,"refresh":"5s","time":{"from":"now-15m","to":"now"},"panels":[{"id":1,"type":"stat","title":"Mensagens prontas","datasource":"Prometheus","gridPos":{"h":4,"w":4,"x":0,"y":0},"targets":[{"refId":"A","expr":"max(rabbitmq_queue_messages_ready{namespace=\"messaging\",queue=\"memory-jobs\"}) or vector(0)"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]}},{"id":2,"type":"stat","title":"Consumidores","datasource":"Prometheus","gridPos":{"h":4,"w":4,"x":4,"y":0},"targets":[{"refId":"A","expr":"max(rabbitmq_queue_consumers{namespace=\"messaging\",queue=\"memory-jobs\"}) or vector(0)"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]}},{"id":3,"type":"stat","title":"Réplicas desejadas","datasource":"Prometheus","gridPos":{"h":4,"w":4,"x":8,"y":0},"targets":[{"refId":"A","expr":"kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"memory-lab\",horizontalpodautoscaler=\"keda-hpa-memory-worker-rabbitmq\"}"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]}},{"id":4,"type":"stat","title":"Réplicas prontas","datasource":"Prometheus","gridPos":{"h":4,"w":4,"x":12,"y":0},"targets":[{"refId":"A","expr":"kube_deployment_status_replicas_ready{namespace=\"memory-lab\",deployment=\"memory-worker\"}"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]}},{"id":5,"type":"stat","title":"OOMKilled (15m)","datasource":"Prometheus","gridPos":{"h":4,"w":4,"x":16,"y":0},"targets":[{"refId":"A","expr":"sum(max_over_time(kube_pod_container_status_last_terminated_reason{namespace=\"memory-lab\",container=\"memory-worker\",reason=\"OOMKilled\"}[15m])) or vector(0)"}],"fieldConfig":{"defaults":{"decimals":0,"thresholds":{"mode":"absolute","steps":[{"color":"green"},{"color":"red","value":1}]}},"overrides":[]}},{"id":6,"type":"stat","title":"KEDA ativo (derivado)","datasource":"Prometheus","gridPos":{"h":4,"w":4,"x":20,"y":0},"targets":[{"refId":"A","expr":"(max(rabbitmq_queue_messages_ready{namespace=\"messaging\",queue=\"memory-jobs\"}) \u003e bool 0) or vector(0)"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]}},{"id":7,"type":"timeseries","title":"Fila memory-jobs","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"refId":"A","expr":"max(rabbitmq_queue_messages_ready{namespace=\"messaging\",queue=\"memory-jobs\"}) or vector(0)","legendFormat":"ready"},{"refId":"B","expr":"max(rabbitmq_queue_messages_unacked{namespace=\"messaging\",queue=\"memory-jobs\"}) or vector(0)","legendFormat":"unacked"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]}},{"id":8,"type":"timeseries","title":"Scale KEDA","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":12,"y":4},"targets":[{"refId":"A","expr":"kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"memory-lab\",horizontalpodautoscaler=\"keda-hpa-memory-worker-rabbitmq\"}","legendFormat":"desejadas"},{"refId":"B","expr":"kube_deployment_status_replicas_ready{namespace=\"memory-lab\",deployment=\"memory-worker\"}","legendFormat":"prontas"},{"refId":"C","expr":"kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"memory-lab\",horizontalpodautoscaler=\"keda-hpa-memory-worker-rabbitmq\"}","legendFormat":"máximo"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]}},{"id":9,"type":"timeseries","title":"Working set por pod","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":0,"y":12},"targets":[{"refId":"A","expr":"max by (pod) (container_memory_working_set_bytes{namespace=\"memory-lab\",container=\"memory-worker\"})","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"bytes"},"overrides":[]}},{"id":10,"type":"timeseries","title":"Uso em relação ao limit","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":12,"y":12},"targets":[{"refId":"A","expr":"max by (pod) (container_memory_working_set_bytes{namespace=\"memory-lab\",container=\"memory-worker\"}) / on(pod) max by (pod) (kube_pod_container_resource_limits{namespace=\"memory-lab\",container=\"memory-worker\",resource=\"memory\"} \u003e 0)","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"unit":"percentunit","min":0,"max":1},"overrides":[]}},{"id":11,"type":"timeseries","title":"Reinícios por pod","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":0,"y":20},"targets":[{"refId":"A","expr":"kube_pod_container_status_restarts_total{namespace=\"memory-lab\",container=\"memory-worker\"}","legendFormat":"{{pod}}"}],"fieldConfig":{"defaults":{"decimals":0},"overrides":[]}},{"id":12,"type":"timeseries","title":"Memória disponível nos nodes","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":12,"y":20},"targets":[{"refId":"A","expr":"100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes","legendFormat":"{{instance}}"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100},"overrides":[]}},{"id":13,"fieldConfig":{"defaults":{"decimals":0},"overrides":[]},"gridPos":{"y":28,"w":6,"x":0,"h":8},"targets":[{"legendFormat":"{{node}}","expr":"count by (node) (kube_pod_info{namespace=\"memory-lab\",pod=~\"memory-worker-.*\"})","refId":"A"}],"datasource":"Prometheus","type":"timeseries","title":"Pods por node"},{"id":14,"fieldConfig":{"defaults":{"min":0,"decimals":0,"max":1},"overrides":[]},"gridPos":{"y":28,"w":6,"x":6,"h":8},"targets":[{"legendFormat":"{{node}}","expr":"kube_node_status_condition{condition=\"Ready\",status=\"true\"}","refId":"A"}],"datasource":"Prometheus","type":"timeseries","title":"Nodes Ready"},{"id":15,"fieldConfig":{"defaults":{"decimals":0},"overrides":[]},"gridPos":{"y":28,"w":6,"x":12,"h":8},"targets":[{"legendFormat":"pending","expr":"sum(kube_pod_status_phase{namespace=\"memory-lab\",phase=\"Pending\"}) or vector(0)","refId":"A"}],"datasource":"Prometheus","type":"timeseries","title":"Pods pendentes"},{"id":16,"fieldConfig":{"defaults":{"unit":"s"},"overrides":[]},"gridPos":{"y":28,"w":6,"x":18,"h":8},"targets":[{"legendFormat":"{{pod}}","expr":"(time() - kube_pod_created{namespace=\"memory-lab\"}) and on(pod) (kube_pod_status_phase{namespace=\"memory-lab\",phase=\"Pending\"} == 1)","refId":"A"}],"datasource":"Prometheus","type":"timeseries","title":"Tempo pendente para reagendamento"}]}
