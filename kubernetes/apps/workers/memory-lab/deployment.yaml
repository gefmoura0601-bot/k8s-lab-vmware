apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-worker
  namespace: memory-lab
  labels:
    app: memory-worker
    team: platform
    environment: lab
spec:
  replicas: 0
  selector:
    matchLabels:
      app: memory-worker
  template:
    metadata:
      labels:
        app: memory-worker
        team: platform
        environment: lab
    spec:
      priorityClassName: batch-low
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: memory-worker
      containers:
        - name: memory-worker
          image: docker.io/curlimages/curl:8.16.0
          command:
            - /bin/sh
            - /scripts/worker.sh
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: memory-lab-rabbitmq
                  key: RABBITMQ_URL
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: memory-lab-rabbitmq
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: memory-lab-rabbitmq
                  key: RABBITMQ_PASS
            - name: QUEUE_NAME
              value: memory-jobs
            - name: HOLD_SECONDS
              value: '5'
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: memory-worker-script
            defaultMode: 365