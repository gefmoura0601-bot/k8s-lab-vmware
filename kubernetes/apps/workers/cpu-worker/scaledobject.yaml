apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cpu-worker-rabbitmq
  namespace: workers
spec:
  scaleTargetRef:
    name: cpu-worker
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 1
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 2
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 60
          selectPolicy: Max
          policies:
            - type: Percent
              value: 50
              periodSeconds: 15
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: cpu-jobs
        mode: QueueLength
        value: "5"
        hostFromEnv: RABBITMQ_URL
