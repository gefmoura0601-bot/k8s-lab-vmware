apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-web
  namespace: banking
  labels: {app: banking-web, team: banking, environment: lab}
spec:
  replicas: 1
  selector:
    matchLabels: {app: banking-web}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: banking-web, team: banking, environment: lab}
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/proxyCPU: 20m
        sidecar.istio.io/proxyCPULimit: 150m
        sidecar.istio.io/proxyMemory: 48Mi
        sidecar.istio.io/proxyMemoryLimit: 96Mi
    spec:
      serviceAccountName: banking-web
      imagePullSecrets: [{name: ghcr-secret}]
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: banking-web
          image: ghcr.io/gefmoura0601-bot/banking-web:bootstrap
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 150m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: banking-web
  namespace: banking
  labels: {app: banking-web, team: banking, environment: lab}
spec:
  selector: {app: banking-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: banking-web
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: banking-web}
