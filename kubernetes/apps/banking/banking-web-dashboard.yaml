apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-web-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1", app: banking-web}
data:
  banking-web.json: |
    {"uid":"banking-web","title":"Banking / Web","tags":["banking","frontend","istio"],"schemaVersion":39,"version":1,"refresh":"15s","panels":[{"id":1,"type":"stat","title":"Frontend disponível","datasource":"Prometheus","gridPos":{"h":4,"w":6,"x":0,"y":0},"targets":[{"refId":"A","expr":"max(kube_deployment_status_replicas_available{namespace=\"banking\",deployment=\"banking-web\"}) or vector(0)"}]},{"id":2,"type":"stat","title":"Requisições/s","datasource":"Prometheus","gridPos":{"h":4,"w":6,"x":6,"y":0},"targets":[{"refId":"A","expr":"sum(rate(istio_requests_total{destination_service_name=\"banking-web\"}[5m])) or vector(0)"}]},{"id":3,"type":"stat","title":"Erros 5xx","datasource":"Prometheus","gridPos":{"h":4,"w":6,"x":12,"y":0},"targets":[{"refId":"A","expr":"sum(rate(istio_requests_total{destination_service_name=\"banking-web\",response_code=~\"5..\"}[5m])) or vector(0)"}]},{"id":4,"type":"stat","title":"Latência p95","datasource":"Prometheus","gridPos":{"h":4,"w":6,"x":18,"y":0},"targets":[{"refId":"A","expr":"histogram_quantile(0.95,sum by(le)(rate(istio_request_duration_milliseconds_bucket{destination_service_name=\"banking-web\"}[5m]))) or vector(0)"}]},{"id":5,"type":"timeseries","title":"Tráfego por resposta","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"refId":"A","expr":"sum by(response_code)(rate(istio_requests_total{destination_service_name=\"banking-web\"}[5m]))","legendFormat":"HTTP {{response_code}}"}]},{"id":6,"type":"timeseries","title":"CPU e memória","datasource":"Prometheus","gridPos":{"h":8,"w":12,"x":12,"y":4},"targets":[{"refId":"A","expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"banking\",container=\"banking-web\"}[5m]))","legendFormat":"CPU"},{"refId":"B","expr":"sum(container_memory_working_set_bytes{namespace=\"banking\",container=\"banking-web\"})","legendFormat":"memória"}]}]}
