apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: account-service
  namespace: banking
  labels:
    app: account-service
    team: banking
    environment: lab
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: account-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: transaction-service
  namespace: banking
  labels:
    app: transaction-service
    team: banking
    environment: lab
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: transaction-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: banking-ledger
  namespace: banking
  labels:
    release: kube-prometheus-stack
    team: banking
spec:
  groups:
    - name: banking-ledger
      rules:
        - alert: BankingLedgerDivergence
          expr: banking_ledger_divergent_accounts > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Saldo de conta diverge do ledger"
            description: "Uma ou mais contas possuem saldo diferente da soma dos lancamentos."
