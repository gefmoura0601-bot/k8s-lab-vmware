apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: account-service
  namespace: banking
  labels:
    app: account-service
    team: banking
    environment: lab
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: account-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: transaction-service
  namespace: banking
  labels:
    app: transaction-service
    team: banking
    environment: lab
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: transaction-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: banking-ledger
  namespace: banking
  labels:
    release: kube-prometheus-stack
    team: banking
spec:
  groups:
    - name: banking-ledger
      rules:
        - alert: BankingLedgerDivergence
          expr: banking_ledger_divergent_accounts > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Saldo de conta diverge do ledger"
            description: "Uma ou mais contas possuem saldo diferente da soma dos lancamentos."
    - name: banking-pix
      rules:
        - alert: BankingPixHighFailureRatio
          expr: sum(rate(banking_pix_transfers_total{outcome=~"failed|rejected"}[10m])) / clamp_min(sum(rate(banking_pix_transfers_total[10m])), 0.001) > 0.20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Taxa elevada de falhas PIX"
            description: "Mais de 20% das requisicoes PIX falharam ou foram rejeitadas nos ultimos 10 minutos."
    - name: banking-cards
      rules:
        - alert: BankingCardAcquiringTechnicalFailures
          expr: sum(rate(banking_card_acquiring_payments_total{status="technical_failure"}[10m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Falhas tecnicas na adquirencia de cartoes"
            description: "A adquirencia nao conseguiu concluir uma ou mais chamadas ao emissor."
        - alert: BankingStoreCheckoutTechnicalFailures
          expr: sum(rate(store_checkout_requests_total{outcome="error"}[10m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Falhas tecnicas no checkout da loja"
            description: "A loja nao conseguiu concluir um ou mais checkouts nos ultimos 10 minutos."
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: acquirer-service
  namespace: banking
