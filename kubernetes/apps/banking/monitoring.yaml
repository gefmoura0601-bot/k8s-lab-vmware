apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: account-service
  namespace: banking
  labels:
    app: account-service
    team: banking
    environment: lab
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: account-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: transaction-service
  namespace: banking
  labels:
    app: transaction-service
    team: banking
    environment: lab
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: transaction-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
