kind: HorizontalPodAutoscaler
metadata:
  name: transaction-service
  namespace: banking
  labels:
    app: transaction-service
    team: banking
    environment: lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
