apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: banking
  labels:
    app: transaction-service
    team: banking
    environment: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: transaction-service
        team: banking
        environment: lab
    spec:
      serviceAccountName: transaction-service
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transaction-service
          image: ghcr.io/gefmoura0601-bot/transaction-service-dotnet:71d7189
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_EnableDiagnostics
              value: "1"
            - name: DOTNET_EnableDiagnostics_IPC
              value: "1"
            - name: DOTNET_EnableDiagnostics_Profiler
              value: "1"
            - name: DOTNET_DiagnosticPorts
              value: /diagnostics/port.sock,nosuspend
            - name: COMPlus_PerfMapEnabled
              value: "1"
            - name: AccountServiceUrl
              value: http://account-service.banking.svc.cluster.local
            - name: ConnectionStrings__Transactions
              valueFrom:
                secretKeyRef:
                  name: banking-db
                  key: dotnet-connection-string
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: diagnostics
              mountPath: /diagnostics
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 75m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            capabilities:
              drop: [ALL]
        - name: dotnet-monitor
          image: mcr.microsoft.com/dotnet/monitor:10
          imagePullPolicy: IfNotPresent
          args:
            - collect
            - --diagnostic-port
            - /diagnostics/port.sock
            - --urls
            - http://127.0.0.1:52323
            - --no-auth
          ports:
            - name: diagnostics
              containerPort: 52323
          volumeMounts:
            - name: diagnostics
              mountPath: /diagnostics
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            capabilities:
              drop: [ALL]
      volumes:
        - name: diagnostics
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: banking
  labels:
    app: transaction-service
    team: banking
    environment: lab
spec:
  selector:
    app: transaction-service
  ports:
    - name: http
      port: 80
      targetPort: http
