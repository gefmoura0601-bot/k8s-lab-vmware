apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: postgres-api
data:
  postgres-api-dashboard.json: |
    {
      "uid": "postgres-api-overview",
      "title": "Postgres API Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "API Up",
          "datasource": "Prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{namespace=\"apps\",pod=~\"postgres-api-.*\"})"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Goroutines",
          "datasource": "Prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "max(go_goroutines{namespace=\"apps\",pod=~\"postgres-api-.*\"})"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Heap Alloc",
          "datasource": "Prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "max(go_memstats_alloc_bytes{namespace=\"apps\",pod=~\"postgres-api-.*\"})"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "RSS Memory",
          "datasource": "Prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "max(process_resident_memory_bytes{namespace=\"apps\",pod=~\"postgres-api-.*\"})"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU Usage (rate)",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(process_cpu_seconds_total{namespace=\"apps\",pod=~\"postgres-api-.*\"}[5m]))"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single" }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Goroutines",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "refId": "A",
              "expr": "go_goroutines{namespace=\"apps\",pod=~\"postgres-api-.*\"}"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single" }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Heap Alloc Bytes",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "go_memstats_alloc_bytes{namespace=\"apps\",pod=~\"postgres-api-.*\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single" }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "GC Pause Sum Rate",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(go_gc_duration_seconds_sum{namespace=\"apps\",pod=~\"postgres-api-.*\"}[5m])"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single" }
          }
        }
      ]
    }
