apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-api-migration-v1
  namespace: apps
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
data:
  V1__create_users.sql: |
    BEGIN;
    CREATE TABLE IF NOT EXISTS schema_migrations (
      version bigint PRIMARY KEY,
      description text NOT NULL,
      applied_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS users (
      id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      name varchar(200) NOT NULL,
      email varchar(320) NOT NULL UNIQUE,
      created_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_users_created_at ON users (created_at DESC);
    INSERT INTO schema_migrations (version, description)
    VALUES (1, 'create users table') ON CONFLICT (version) DO NOTHING;
    COMMIT;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-api-migration-v1
  namespace: apps
  labels: {app: postgres-api, component: migration, team: platform, environment: lab}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: postgres-api, component: migration, team: platform, environment: lab}}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: postgres:17-alpine
          command: [sh, -ec]
          args:
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -f /migrations/V1__create_users.sql
              test "$(psql -v ON_ERROR_STOP=1 -Atc 'SELECT version FROM schema_migrations WHERE version = 1')" = "1"
          envFrom: [{configMapRef: {name: postgres-api-config}}, {secretRef: {name: postgres-api-secret}}]
          env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-api-secret, key: POSTGRES_PASSWORD}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 96Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: migrations, mountPath: /migrations, readOnly: true}]
      volumes: [{name: migrations, configMap: {name: postgres-api-migration-v1}}]
