apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-api-egress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: postgres-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
