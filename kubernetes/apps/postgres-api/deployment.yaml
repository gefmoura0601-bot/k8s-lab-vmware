apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-api
  namespace: apps
  labels:
    app: postgres-api
    team: platform
    environment: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-api
  template:
    metadata:
      labels:
        app: postgres-api
        team: platform
        environment: lab
    spec:
      containers:
        - name: postgres-api
          image: postgres-api-go
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: postgres-api-config
            - secretRef:
                name: postgres-api-secret
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
