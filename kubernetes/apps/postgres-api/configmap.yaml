apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-api-config
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
  namespace: apps
  labels:
    app: postgres-api
    environment: lab
    team: platform
data:
  POSTGRES_DB: appdb
  POSTGRES_HOST: postgres.databases.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: disable
  SERVER_PORT: "8080"
