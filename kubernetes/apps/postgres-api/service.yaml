apiVersion: v1
kind: Service
metadata:
  name: postgres-api
  namespace: apps
  labels:
    app: postgres-api
    environment: lab
    team: platform
spec:
  selector:
    app: postgres-api
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 15020
      targetPort: 15020
