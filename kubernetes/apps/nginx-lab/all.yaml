apiVersion: v1
kind: Namespace
metadata:
  name: nginx-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-lab-pvc
  namespace: nginx-lab
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lab
  namespace: nginx-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-lab
  template:
    metadata:
      labels:
        app: nginx-lab
    spec:
      initContainers:
        - name: init-html
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cat <<'HTML' > /workdir/index.html
              <!DOCTYPE html>
              <html lang="pt-BR">
              <head>
                <meta charset="UTF-8">
                <title>Nginx Lab</title>
              </head>
              <body>
                <h1>Nginx Lab via ArgoCD</h1>
                <p>Deploy realizado com sucesso no namespace nginx-lab.</p>
              </body>
              </html>
              HTML
          volumeMounts:
            - name: app-data
              mountPath: /workdir
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: nginx-lab-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lab
  namespace: nginx-lab
spec:
  type: NodePort
  selector:
    app: nginx-lab
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
