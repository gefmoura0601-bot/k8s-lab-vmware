apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: messaging
  labels:
    app: rabbitmq
    team: platform
    environment: lab
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 32742
    - name: http-management
      port: 15672
      targetPort: 15672
      nodePort: 30137
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: messaging
  labels:
    app: rabbitmq
    team: platform
    environment: lab
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: http-management
      port: 15672
      targetPort: 15672
