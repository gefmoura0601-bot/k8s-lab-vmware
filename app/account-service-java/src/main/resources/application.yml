spring:
  application:
    name: account-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres.databases.svc.cluster.local:5432/appdb}
    username: ${DATABASE_USER:appuser}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: account_service
    schemas: account_service
    create-schemas: true
server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
banking:
  # Stable key material: rotation requires migrating existing fingerprints and credentials.
  card-secret: ${BANKING_CARD_SECRET:}
  identity-secret: ${BANKING_IDENTITY_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
