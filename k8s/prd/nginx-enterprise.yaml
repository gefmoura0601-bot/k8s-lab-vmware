apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-enterprise
  namespace: prd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-enterprise
  template:
    metadata:
      labels:
        app: nginx-enterprise
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: storage-xfs
          mountPath: /usr/share/nginx/html
      volumes:
      - name: storage-xfs
        persistentVolumeClaim:
          claimName: pvc-teste-enterprise # Aquele que já deixamos BOUND
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: prd
spec:
  selector:
    app: nginx-enterprise
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
