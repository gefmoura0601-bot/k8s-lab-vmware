apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-enterprise
  namespace: prd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-enterprise
  template:
    metadata:
      labels:
        app: nginx-enterprise
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: storage-xfs
          mountPath: /usr/share/nginx/html
      volumes:
      - name: storage-xfs
        persistentVolumeClaim:
          claimName: pvc-teste-enterprise # Aquele que já deixamos BOUND
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: prd
spec:
  selector:
    app: nginx-enterprise
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-prd
  namespace: prd
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: prd.nginx.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-prd
  namespace: prd
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: prd.nginx.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
